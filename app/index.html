<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>클콩 제작2파트 비서</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">2</div>
        <div class="brand-text">
          <strong>제작2파트</strong>
          <span>파트장 비서</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-view="today"><span class="nav-icon">☀️</span>오늘<kbd>1</kbd></button>
        <button class="nav-item" data-view="calendar"><span class="nav-icon">🗓️</span>캘린더<kbd>2</kbd></button>
        <button class="nav-item" data-view="checklist"><span class="nav-icon">✅</span>체크리스트<kbd>3</kbd></button>
        <button class="nav-item" data-view="team"><span class="nav-icon">👥</span>팀<kbd>4</kbd></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙️</span>설정<kbd>,</kbd></button>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-label">팀원 보기</div>
        <div id="member-filter" class="member-filter"></div>
      </div>

      <div class="sidebar-foot">
        <button class="btn btn-primary btn-block" id="btn-new-event">+ 새 일정</button>
        <div class="save-state" id="save-state">불러오는 중…</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">오늘</h1>
          <p id="view-subtitle"></p>
        </div>
        <div class="topbar-actions">
          <div class="search-box">
            <input type="search" id="search-input" placeholder="일정 · 할 일 검색  ( / )" autocomplete="off" />
            <div class="search-results" id="search-results" hidden></div>
          </div>
          <div id="view-actions" class="view-actions"></div>
        </div>
      </header>

      <div class="view-scroll">
        <div id="view"></div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/io.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/checklist.js"></script>
  <script src="js/views/team.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
